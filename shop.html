<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — EMGOVI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">EMGOVI</a>
  <div id="category-nav"></div>
  <form class="search-form" id="search-form">
    <input type="text" id="search-input" placeholder="Search phones…">
  </form>
  <div class="header-actions">
    <a href="account.html" class="icon-btn">Account</a>
    <a href="cart.html" class="icon-btn">Cart<span class="cart-badge" style="display:none">0</span></a>
  </div>
</header>

<div class="container section">
  <h1 style="font-size:28px; margin-bottom:24px;" id="page-title">All phones</h1>
  <div id="grid" class="product-grid"></div>
  <div id="empty-state" class="empty-state" style="display:none;">
    <h2>No products found</h2>
    <p>Nothing in this category yet.</p>
  </div>
</div>

<footer class="site-footer">EMGOVI — Lagos, Nigeria</footer>

<script src="js/app.js"></script>
<script>
let allProducts = [];

function renderGrid(products) {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty-state');

  if (products.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = products.map((p) => {
    const totalStock = (p.variants || []).reduce((sum, v) => sum + v.stock_qty, 0);
    const minPrice = (p.variants || []).length
      ? Math.min(...p.variants.map((v) => v.price))
      : p.base_price;
    const thumbContent = p.is_digital
      ? `<div class="gift-card-visual small"><div class="gc-logo">EMGOVI</div><div class="gc-amount">${formatNaira(minPrice)}</div><div class="gc-label">Gift Card</div></div>`
      : (p.image_url ? `<img src="${p.image_url}" alt="${p.name}">` : '');
    return `
      <a class="product-card" href="product.html?id=${p.id}">
        <div class="thumb">
          ${thumbContent}
        </div>
        <div class="info">
          <div class="name">${p.name}</div>
          <div class="price">From ${formatNaira(minPrice)}</div>
          ${stockBadge(totalStock)}
        </div>
      </a>`;
  }).join('');
}

function applySearch(term) {
  const q = term.trim().toLowerCase();
  if (!q) {
    renderGrid(allProducts);
    return;
  }
  const filtered = allProducts.filter((p) =>
    p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q)
  );
  renderGrid(filtered);
}

async function loadShop() {
  const params = new URLSearchParams(location.search);
  const category = params.get('category');
  const search = params.get('search') || '';

  if (category) document.getElementById('page-title').textContent = category;
  if (search) {
    document.getElementById('page-title').textContent = `Results for "${search}"`;
    document.getElementById('search-input').value = search;
  }

  try {
    const url = category ? `/api/products?category=${encodeURIComponent(category)}` : '/api/products';
    const fetched = await fetchJSON(url);
    allProducts = fetched.filter((p) => !p.is_addon);
    applySearch(search);
  } catch (err) {
    console.error(err);
  }
}

document.getElementById('search-form').addEventListener('submit', (e) => {
  e.preventDefault();
  applySearch(document.getElementById('search-input').value);
});
document.getElementById('search-input').addEventListener('input', (e) => {
  applySearch(e.target.value);
});

loadShop();
</script>
</body>
</html>
