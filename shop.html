<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — EMGOVI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">EMGOVI</a>
  <nav>
    <a href="shop.html">Shop</a>
    <a href="shop.html?category=Phones">Phones</a>
  </nav>
  <div class="header-actions">
    <a href="account.html" class="icon-btn">Account</a>
    <a href="cart.html" class="icon-btn">Cart<span class="cart-badge" style="display:none">0</span></a>
  </div>
</header>

<div class="container section">
  <h1 style="font-size:28px; margin-bottom:24px;" id="page-title">All phones</h1>
  <div id="grid" class="product-grid"></div>
  <div id="empty-state" class="empty-state" style="display:none;">
    <h2>No products found</h2>
    <p>Nothing in this category yet.</p>
  </div>
</div>

<footer class="site-footer">EMGOVI — Lagos, Nigeria</footer>

<script src="js/app.js"></script>
<script>
async function loadShop() {
  const params = new URLSearchParams(location.search);
  const category = params.get('category');
  if (category) document.getElementById('page-title').textContent = category;

  try {
    const url = category ? `/api/products?category=${encodeURIComponent(category)}` : '/api/products';
    const products = await fetchJSON(url);
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty-state');

    if (products.length === 0) {
      empty.style.display = 'block';
      return;
    }

    grid.innerHTML = products.map((p) => {
      const totalStock = (p.variants || []).reduce((sum, v) => sum + v.stock_qty, 0);
      const minPrice = (p.variants || []).length
        ? Math.min(...p.variants.map((v) => v.price))
        : p.base_price;
      return `
        <a class="product-card" href="product.html?id=${p.id}">
          <div class="thumb">
            ${p.image_url ? `<img src="${p.image_url}" alt="${p.name}">` : ''}
          </div>
          <div class="info">
            <div class="name">${p.name}</div>
            <div class="price">From ${formatNaira(minPrice)}</div>
            ${stockBadge(totalStock)}
          </div>
        </a>`;
    }).join('');
  } catch (err) {
    console.error(err);
  }
}
loadShop();
</script>
</body>
</html>
