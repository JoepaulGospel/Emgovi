<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — EMGOVI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">EMGOVI</a>
  <div id="category-nav"></div>
  <form class="search-form" onsubmit="event.preventDefault(); const q=this.querySelector('input').value.trim(); if(q) location.href='shop.html?search='+encodeURIComponent(q);">
    <input type="text" placeholder="Search phones…">
  </form>
  <div class="header-actions">
    <a href="account.html" class="icon-btn">Account</a>
    <a href="cart.html" class="icon-btn">Cart<span class="cart-badge" style="display:none">0</span></a>
  </div>
</header>

<div class="container section" style="max-width:560px;">
  <div id="checkout-content"></div>
</div>

<footer class="site-footer">EMGOVI — Lagos, Nigeria</footer>

<script src="js/app.js"></script>
<script>
async function init() {
  const params = new URLSearchParams(location.search);
  const reference = params.get('reference');

  if (reference) {
    await handleVerification(reference);
    return;
  }

  const user = await getCurrentUser();
  if (!user) {
    location.href = 'account.html?next=checkout.html';
    return;
  }

  const cart = getCart();
  if (cart.length === 0) {
    location.href = 'cart.html';
    return;
  }

  renderForm(user, cart);
}

function renderForm(user, cart) {
  const allDigital = cart.every(i => i.is_digital);
  renderCheckoutBody(user, cart, allDigital);
  attachUpsell(user);
}

function renderCheckoutBody(user, cart, allDigital) {
  document.getElementById('checkout-content').innerHTML = `
    <h1 style="font-size:26px; margin-bottom:24px;">Checkout</h1>
    <div class="cart-summary" style="margin-bottom:24px;">
      ${cart.map(i => `<div class="row"><span>${i.product_name} (${i.variant_label || ''}) × ${i.quantity}</span><span>${formatNaira(i.price * i.quantity)}</span></div>`).join('')}
      <div class="row total"><span>Total</span><span>${formatNaira(cartTotal())}</span></div>
    </div>
    <div id="addon-upsell"></div>
    <div id="form-error" class="form-error"></div>
    ${allDigital ? `<p style="color:var(--text-secondary); font-size:14px; margin-bottom:16px;">This order is fully digital, your gift card code will be emailed to you right after payment. No delivery address needed.</p>` : `
    <div class="form-group">
      <label>Delivery address</label>
      <textarea id="address" rows="3" placeholder="Street, area, city, state"></textarea>
    </div>`}
    <div class="form-group">
      <label>Phone number</label>
      <input id="phone" type="tel" placeholder="e.g. 08012345678" value="${user.phone || ''}">
    </div>
    <button id="pay-btn" class="btn btn-primary btn-block">Pay ${formatNaira(cartTotal())} with Paystack</button>
  `;

  document.getElementById('pay-btn').addEventListener('click', async () => {
    const address = allDigital ? '' : document.getElementById('address').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const errorEl = document.getElementById('form-error');
    errorEl.classList.remove('visible');

    if (!phone || (!allDigital && !address)) {
      errorEl.textContent = allDigital
        ? 'Please enter your phone number.'
        : 'Please fill in your delivery address and phone number.';
      errorEl.classList.add('visible');
      return;
    }

    const payBtn = document.getElementById('pay-btn');
    payBtn.disabled = true;
    payBtn.textContent = 'Starting payment…';

    try {
      const freshCart = getCart();
      const data = await fetchJSON('/api/paystack-init', {
        method: 'POST',
        body: JSON.stringify({
          items: freshCart.map(i => ({ variant_id: i.variant_id, quantity: i.quantity })),
          delivery_address: address,
          phone,
        }),
      });
      location.href = data.authorization_url;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.add('visible');
      payBtn.disabled = false;
      payBtn.textContent = `Pay ${formatNaira(cartTotal())} with Paystack`;
    }
  });
}

// Last-chance offer: if the cart has a physical item (like a phone) in a
// category that has an add-on (like the Protection Plan) and that add-on
// isn't in the cart yet, show it here so it's not only ever seen once on
// the product page.
async function attachUpsell(user) {
  const cart = getCart();
  const cartCategories = [...new Set(cart.map(i => i.category).filter(Boolean))];
  if (cartCategories.length === 0) return;

  try {
    const allProducts = await fetchJSON('/api/products');
    const cartVariantIds = new Set(cart.map(i => i.variant_id));

    const relevantAddons = allProducts.filter(p =>
      p.is_addon &&
      cartCategories.includes(p.addon_for_category) &&
      !p.variants.some(v => cartVariantIds.has(v.id))
    );

    if (relevantAddons.length === 0) return;

    const upsellEl = document.getElementById('addon-upsell');
    upsellEl.innerHTML = relevantAddons.map(addon => `
      <div class="option-group" style="background:var(--bg-alt); border-radius:var(--radius-md); padding:16px; margin-bottom:16px;">
        <label style="margin-bottom:2px;">Before you pay: add ${addon.name}?</label>
        <p style="font-size:13px; color:var(--text-secondary); margin:0 0 10px;">${addon.description || ''}</p>
        <div class="denomination-grid">
          ${addon.variants.map(v => `
            <button class="denomination-pill upsell-add-btn" data-variant-id="${v.id}" data-product-name="${addon.name}" data-label="${v.storage || v.color || ''}" data-price="${v.price}">
              ${v.storage || v.color}<br><span style="font-weight:400; font-size:12px;">${formatNaira(v.price)}</span>
            </button>
          `).join('')}
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.upsell-add-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        addToCart({
          variant_id: parseInt(btn.dataset.variantId, 10),
          product_name: btn.dataset.productName,
          variant_label: btn.dataset.label,
          price: parseInt(btn.dataset.price, 10),
          quantity: 1,
          image_url: '',
          is_digital: true,
          category: cartCategories[0],
        });
        const updatedCart = getCart();
        const allDigital = updatedCart.every(i => i.is_digital);
        renderCheckoutBody(user, updatedCart, allDigital);
        attachUpsell(user);
      });
    });
  } catch (err) {
    console.error('Add-on upsell failed to load:', err);
  }
}

async function handleVerification(reference) {
  document.getElementById('checkout-content').innerHTML = `<p>Confirming your payment…</p>`;
  try {
    const data = await fetchJSON('/api/paystack-verify', {
      method: 'POST',
      body: JSON.stringify({ reference }),
    });
    clearCart();
    document.getElementById('checkout-content').innerHTML = `
      <div class="empty-state">
        <h2>Payment successful</h2>
        <p>Order #${data.order_id} is confirmed. We'll begin processing it right away.</p>
        <a href="account.html" class="btn btn-primary" style="margin-top:16px;">View your orders</a>
      </div>
    `;
  } catch (err) {
    document.getElementById('checkout-content').innerHTML = `
      <div class="empty-state">
        <h2>Payment could not be confirmed</h2>
        <p>${err.message}</p>
        <a href="cart.html" class="btn btn-secondary" style="margin-top:16px;">Back to cart</a>
      </div>
    `;
  }
}

init();
</script>
</body>
</html>
