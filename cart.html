<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your cart — EMGOVI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">EMGOVI</a>
  <nav>
    <a href="shop.html">Shop</a>
    <a href="shop.html?category=Phones">Phones</a>
  </nav>
  <form class="search-form" onsubmit="event.preventDefault(); const q=this.querySelector('input').value.trim(); if(q) location.href='shop.html?search='+encodeURIComponent(q);">
    <input type="text" placeholder="Search phones…">
  </form>
  <div class="header-actions">
    <a href="account.html" class="icon-btn">Account</a>
    <a href="cart.html" class="icon-btn">Cart<span class="cart-badge" style="display:none">0</span></a>
  </div>
</header>

<div class="container section" style="max-width:720px;">
  <h1 style="font-size:28px; margin-bottom:24px;">Your cart</h1>
  <div id="cart-items"></div>
  <div id="empty-state" class="empty-state" style="display:none;">
    <h2>Your cart is empty</h2>
    <p>Browse our phones and add something you like.</p>
    <a href="shop.html" class="btn btn-primary" style="margin-top:16px;">Shop now</a>
  </div>
  <div id="summary" style="margin-top:24px;"></div>
</div>

<footer class="site-footer">EMGOVI — Lagos, Nigeria</footer>

<script src="js/app.js"></script>
<script>
function renderCart() {
  const cart = getCart();
  const itemsEl = document.getElementById('cart-items');
  const emptyEl = document.getElementById('empty-state');
  const summaryEl = document.getElementById('summary');

  if (cart.length === 0) {
    itemsEl.innerHTML = '';
    summaryEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  itemsEl.innerHTML = cart.map(item => `
    <div class="cart-row" data-variant="${item.variant_id}">
      <div class="thumb">${item.image_url ? `<img src="${item.image_url}">` : ''}</div>
      <div class="details">
        <div class="name">${item.product_name}</div>
        <div class="variant">${item.variant_label || ''}</div>
        <div class="variant">${formatNaira(item.price)}</div>
      </div>
      <div class="qty-control">
        <button class="qty-minus">−</button>
        <span>${item.quantity}</span>
        <button class="qty-plus">+</button>
      </div>
      <button class="remove-link">Remove</button>
    </div>
  `).join('');

  summaryEl.innerHTML = `
    <div class="cart-summary">
      <div class="row total"><span>Total</span><span>${formatNaira(cartTotal())}</span></div>
    </div>
    <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:16px;">Proceed to checkout</a>
  `;

  itemsEl.querySelectorAll('.cart-row').forEach(row => {
    const variantId = parseInt(row.dataset.variant, 10);
    row.querySelector('.qty-minus').addEventListener('click', () => {
      const item = getCart().find(c => c.variant_id === variantId);
      updateCartQty(variantId, item.quantity - 1);
      renderCart();
    });
    row.querySelector('.qty-plus').addEventListener('click', () => {
      const item = getCart().find(c => c.variant_id === variantId);
      updateCartQty(variantId, item.quantity + 1);
      renderCart();
    });
    row.querySelector('.remove-link').addEventListener('click', () => {
      removeFromCart(variantId);
      renderCart();
    });
  });
}
renderCart();
</script>
</body>
</html>
