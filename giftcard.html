<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy EMGOVI Gift Card</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">EMGOVI</a>
  <div id="category-nav"></div>
  <form class="search-form" onsubmit="event.preventDefault(); const q=this.querySelector('input').value.trim(); if(q) location.href='shop.html?search='+encodeURIComponent(q);">
    <input type="text" placeholder="Search phones">
  </form>
  <div class="header-actions">
    <a href="account.html" class="icon-btn">Account</a>
    <a href="cart.html" class="icon-btn">Cart<span class="cart-badge" style="display:none">0</span></a>
  </div>
</header>

<div class="page-subheader">
  <div class="inner">EMGOVI Gift Card</div>
</div>

<div class="container">
  <div id="content" class="product-detail">
    <p style="text-align:center; color:var(--text-secondary);">Loading</p>
  </div>
</div>

<footer class="site-footer">EMGOVI, Lagos, Nigeria</footer>

<script src="js/app.js"></script>
<script>
let giftCardProduct = null;
let selectedVariantId = null;
let selectedColorIndex = 0;
let qty = 1;

const CARD_COLORS = [
  { name: 'Black', gradient: 'linear-gradient(135deg, #1D1D1F 0%, #3A3A3C 55%, #232325 100%)', text: '#F5F5F7' },
  { name: 'Silver', gradient: 'linear-gradient(135deg, #F2F2F4 0%, #DCDCE0 55%, #C4C4C8 100%)', text: '#1D1D1F' },
  { name: 'Space Gray', gradient: 'linear-gradient(135deg, #5A5A5D 0%, #6E6E73 55%, #48484A 100%)', text: '#F5F5F7' },
  { name: 'Titanium', gradient: 'linear-gradient(135deg, #9C9A90 0%, #B7B4A8 55%, #7D7A6F 100%)', text: '#1D1D1F' },
  { name: 'Gold', gradient: 'linear-gradient(135deg, #F3E3C9 0%, #E5C89E 55%, #C7A06E 100%)', text: '#3A2E1A' },
];

function render() {
  const variant = giftCardProduct.variants.find(v => v.id === selectedVariantId) || giftCardProduct.variants[0];
  selectedVariantId = variant ? variant.id : null;
  const price = variant ? variant.price : giftCardProduct.base_price;
  const color = CARD_COLORS[selectedColorIndex];

  document.getElementById('content').innerHTML = `
    <div class="gallery">
      <div class="gift-card-visual" style="background:${color.gradient}; color:${color.text}; max-width:400px;">
        <div class="gc-logo">EMGOVI</div>
        <div class="gc-amount">${formatNaira(price)}</div>
        <div class="gc-label">${color.name}</div>
      </div>
    </div>
    <div class="buy-box">
      <h1>EMGOVI Gift Card</h1>
      <p style="color:var(--text-secondary); font-size:15px; line-height:1.5;">Delivered by email instantly after payment. Redeemable on anything in the store.</p>

      <div class="option-group">
        <label>Choose a color</label>
        <div class="color-swatch-grid" id="color-grid">
          ${CARD_COLORS.map((c, i) => `
            <button class="color-swatch-item ${i === selectedColorIndex ? 'selected' : ''}" data-color-idx="${i}">
              <span class="color-swatch-circle" style="background:${c.gradient};"></span>
              <span class="color-swatch-label">${c.name}</span>
            </button>
          `).join('')}
        </div>
      </div>

      <div class="option-group">
        <label>Choose an amount</label>
        <div class="denomination-grid" id="denom-grid">
          ${giftCardProduct.variants.map(v => `
            <button class="denomination-pill ${v.id === selectedVariantId ? 'selected' : ''}" data-variant-id="${v.id}">
              ${v.storage || v.color}<br><span style="font-weight:400; font-size:12px;">${formatNaira(v.price)}</span>
            </button>
          `).join('')}
        </div>
      </div>

      <div class="option-group">
        <label>Quantity</label>
        <div class="qty-control" style="width:fit-content;">
          <button id="qty-minus">-</button>
          <span id="qty-value">${qty}</span>
          <button id="qty-plus">+</button>
        </div>
      </div>

      <button id="add-to-cart" class="btn btn-primary btn-block">Add to cart, ${formatNaira(price * qty)}</button>
    </div>
  `;

  attachHandlers();
}

function attachHandlers() {
  document.querySelectorAll('#color-grid .color-swatch-item').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedColorIndex = parseInt(btn.dataset.colorIdx, 10);
      render();
    });
  });

  document.querySelectorAll('#denom-grid .denomination-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedVariantId = parseInt(btn.dataset.variantId, 10);
      render();
    });
  });

  document.getElementById('qty-minus').addEventListener('click', () => {
    qty = Math.max(1, qty - 1);
    render();
  });
  document.getElementById('qty-plus').addEventListener('click', () => {
    qty = qty + 1;
    render();
  });

  document.getElementById('add-to-cart').addEventListener('click', () => {
    const variant = giftCardProduct.variants.find(v => v.id === selectedVariantId);
    if (!variant) return;
    const color = CARD_COLORS[selectedColorIndex];
    addToCart({
      variant_id: variant.id,
      product_name: `${color.name} EMGOVI Gift Card`,
      variant_label: `${color.name}, ${variant.storage || variant.color || ''}`,
      price: variant.price,
      quantity: qty,
      image_url: '',
      is_digital: true,
      category: 'Gift Cards',
    });
    const btn = document.getElementById('add-to-cart');
    btn.textContent = 'Added';
    setTimeout(() => { render(); }, 1200);
  });
}

async function loadGiftCard() {
  try {
    const products = await fetchJSON('/api/products?category=Gift%20Cards');
    if (!products.length) {
      document.getElementById('content').innerHTML = `<p>No gift card available yet.</p>`;
      return;
    }
    giftCardProduct = products[0];
    if (!giftCardProduct.variants || giftCardProduct.variants.length === 0) {
      document.getElementById('content').innerHTML = `<p>No amounts set up yet.</p>`;
      return;
    }
    selectedVariantId = giftCardProduct.variants[0].id;
    render();
  } catch (err) {
    document.getElementById('content').innerHTML = `<p style="color:var(--danger);">${err.message}</p>`;
  }
}
loadGiftCard();
</script>
</body>
</html>
