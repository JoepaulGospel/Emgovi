<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMGOVI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">EMGOVI</a>
  <div id="category-nav"></div>
  <form class="search-form" onsubmit="event.preventDefault(); const q=this.querySelector('input').value.trim(); if(q) location.href='shop.html?search='+encodeURIComponent(q);">
    <input type="text" placeholder="Search phones…">
  </form>
  <div class="header-actions">
    <a href="account.html" class="icon-btn">Account</a>
    <a href="cart.html" class="icon-btn">Cart<span class="cart-badge" style="display:none">0</span></a>
  </div>
</header>

<div class="container">
  <div id="content" class="product-detail"></div>
</div>

<footer class="site-footer">EMGOVI — Lagos, Nigeria</footer>

<script src="js/app.js"></script>
<script>
let product = null;
let selectedColor = null;
let selectedStorage = null;
let availableAddons = [];
let selectedAddonVariantId = null;

function currentVariant() {
  if (!product.variants.length) return null;
  return product.variants.find(v =>
    (!selectedColor || v.color === selectedColor) &&
    (!selectedStorage || v.storage === selectedStorage)
  );
}

function render() {
  const colors = [...new Set(product.variants.map(v => v.color).filter(Boolean))];
  const storages = [...new Set(product.variants.map(v => v.storage).filter(Boolean))];
  const variant = currentVariant();
  const price = variant ? variant.price : product.base_price;
  const stock = variant ? variant.stock_qty : product.variants.reduce((s, v) => s + v.stock_qty, 0);
  const storageLabel = product.is_digital ? 'Denomination' : 'Storage';

  const galleryContent = product.is_digital
    ? `<div class="gift-card-visual">
         <div class="gc-logo">EMGOVI</div>
         <div class="gc-amount">${formatNaira(price)}</div>
         <div class="gc-label">Digital Gift Card</div>
       </div>`
    : (product.image_url ? `<img src="${product.image_url}" alt="${product.name}">` : '');

  const addonBlock = availableAddons.length ? availableAddons.map(addon => `
    <div class="option-group">
      <label>${addon.name}</label>
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 10px;">${addon.description || ''}</p>
      <div class="denomination-grid">
        <button class="denomination-pill ${selectedAddonVariantId === null ? 'selected' : ''}" data-addon-variant="none">No thanks</button>
        ${addon.variants.map(v => `
          <button class="denomination-pill ${selectedAddonVariantId === v.id ? 'selected' : ''}" data-addon-variant="${v.id}" data-addon-price="${v.price}">
            ${v.storage || v.color}<br><span style="font-weight:400; font-size:12px;">${formatNaira(v.price)}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `).join('') : '';

  document.getElementById('content').innerHTML = `
    <div class="gallery">
      ${galleryContent}
    </div>
    <div class="buy-box">
      <h1>${product.name}</h1>
      ${stockBadge(stock)}
      <div class="price">${formatNaira(price)}</div>
      <p style="color:var(--text-secondary); font-size:15px; line-height:1.5;">${product.description || ''}</p>

      ${colors.length ? `
        <div class="option-group">
          <label>Color</label>
          <div class="option-pills" id="color-pills">
            ${colors.map(c => `<button class="option-pill ${c === selectedColor ? 'selected' : ''}" data-color="${c}">${c}</button>`).join('')}
          </div>
        </div>` : ''}

      ${storages.length ? `
        <div class="option-group">
          <label>${storageLabel}</label>
          <div class="${product.is_digital ? 'denomination-grid' : 'option-pills'}" id="storage-pills">
            ${storages.map(s => `<button class="${product.is_digital ? 'denomination-pill' : 'option-pill'} ${s === selectedStorage ? 'selected' : ''}" data-storage="${s}">${s}</button>`).join('')}
          </div>
        </div>` : ''}

      <div class="option-group">
        <label>Quantity</label>
        <div class="qty-control" style="width:fit-content;">
          <button id="qty-minus">−</button>
          <span id="qty-value">1</span>
          <button id="qty-plus">+</button>
        </div>
      </div>

      ${addonBlock}

      <button id="add-to-cart" class="btn btn-primary btn-block" ${!variant || stock <= 0 ? 'disabled' : ''}>
        ${!variant ? 'Select options' : stock <= 0 ? 'Out of stock' : 'Add to cart'}
      </button>
      ${product.is_digital ? `<p style="color:var(--text-secondary); font-size:13px; margin-top:12px;">Delivered by email instantly after payment. No shipping required.</p>` : ''}
    </div>
  `;

  attachHandlers();
}

function attachHandlers() {
  document.querySelectorAll('#color-pills .option-pill').forEach(btn => {
    btn.addEventListener('click', () => { selectedColor = btn.dataset.color; render(); });
  });
  document.querySelectorAll('#storage-pills .option-pill, #storage-pills .denomination-pill').forEach(btn => {
    btn.addEventListener('click', () => { selectedStorage = btn.dataset.storage; render(); });
  });
  document.querySelectorAll('[data-addon-variant]').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedAddonVariantId = btn.dataset.addonVariant === 'none' ? null : parseInt(btn.dataset.addonVariant, 10);
      render();
    });
  });

  let qty = parseInt(document.getElementById('qty-value').textContent, 10);
  document.getElementById('qty-minus').addEventListener('click', () => {
    qty = Math.max(1, qty - 1);
    document.getElementById('qty-value').textContent = qty;
  });
  document.getElementById('qty-plus').addEventListener('click', () => {
    qty = qty + 1;
    document.getElementById('qty-value').textContent = qty;
  });

  const addBtn = document.getElementById('add-to-cart');
  if (addBtn) {
    addBtn.addEventListener('click', () => {
      const variant = currentVariant();
      if (!variant) return;
      addToCart({
        variant_id: variant.id,
        product_name: product.name,
        variant_label: [variant.color, variant.storage].filter(Boolean).join(' / '),
        price: variant.price,
        quantity: qty,
        image_url: product.image_url,
        is_digital: !!product.is_digital,
      });

      if (selectedAddonVariantId !== null) {
        const addonVariant = availableAddons.flatMap(a => a.variants.map(v => ({ ...v, addonName: a.name }))).find(v => v.id === selectedAddonVariantId);
        if (addonVariant) {
          addToCart({
            variant_id: addonVariant.id,
            product_name: addonVariant.addonName,
            variant_label: addonVariant.storage || addonVariant.color || '',
            price: addonVariant.price,
            quantity: qty,
            image_url: '',
            is_digital: true,
          });
        }
      }

      addBtn.textContent = 'Added ✓';
      setTimeout(() => { addBtn.textContent = 'Add to cart'; }, 1200);
    });
  }
}

async function loadProduct() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id) {
    document.getElementById('content').innerHTML = '<p>Product not found.</p>';
    return;
  }
  try {
    product = await fetchJSON(`/api/products?id=${id}`);
    if (!product.variants) product.variants = [];
    if (product.variants.length) {
      selectedColor = product.variants[0].color || null;
      selectedStorage = product.variants[0].storage || null;
    }

    if (!product.is_addon) {
      try {
        const allProducts = await fetchJSON('/api/products');
        availableAddons = allProducts.filter(p => p.is_addon && p.addon_for_category === product.category);
      } catch {
        availableAddons = [];
      }
    }

    render();
  } catch (err) {
    document.getElementById('content').innerHTML = `<p>${err.message}</p>`;
  }
}
loadProduct();
</script>
</body>
</html>
